name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the
      # lockfile says and fails if package.json has drifted from it, which is
      # the difference between a build that reproduces and one that resembles.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # No secrets, on purpose. Every value this app reads is looked up at
      # request time, so `next build` needs none of them — and a CI that
      # needed the production database to compile would be a CI nobody could
      # run from a fork.
      - name: Build
        run: npm run build
