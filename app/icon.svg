<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="from anna">
  <!--
    The project in one glyph: a sheet of paper, three lines of writing, and
    one of them marked. Shapes only — a letterform here would depend on a
    font the browser has no reason to have, and a favicon is 16px before it
    is anything else.
  -->
  <rect width="32" height="32" rx="6" fill="#f6f3ec"/>
  <rect x="5" y="14.4" width="17" height="5.4" rx="1.4" fill="#f7b9cf"/>
  <g fill="#221d18">
    <rect x="7" y="8.4" width="18" height="2.3" rx="1.15"/>
    <rect x="7" y="15.9" width="13.5" height="2.3" rx="1.15"/>
    <rect x="7" y="23.4" width="9" height="2.3" rx="1.15"/>
  </g>
</svg>
